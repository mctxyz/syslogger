name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.12'
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Check dependencies
        run: go mod tidy -diff
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Test with race detector
        run: go test -race -mod=readonly -count=1 ./...

  package:
    name: Package CLI
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.12'
          cache-dependency-path: go.sum
      - name: Build release archives
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            name="mct-syslogger_linux_$arch"
            package_dir="$RUNNER_TEMP/$name"
            mkdir -p "$package_dir/tools" "$package_dir/docs"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -mod=readonly -trimpath -ldflags='-s -w' \
              -o "$package_dir/mct-syslogger" ./tools/mct-syslogger
            cp tools/README.md tools/THIRD_PARTY_NOTICES.md "$package_dir/tools/"
            cp docs/journal.md "$package_dir/docs/"
            tar -C "$RUNNER_TEMP" -czf "dist/$name.tar.gz" "$name"
          done
          "$RUNNER_TEMP/mct-syslogger_linux_amd64/mct-syslogger" --help
      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/mct-syslogger_linux_amd64.tar.gz
            dist/mct-syslogger_linux_arm64.tar.gz
            dist/SHA256SUMS
